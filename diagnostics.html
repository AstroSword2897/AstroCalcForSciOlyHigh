<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroCalc Diagnostics & Validation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover { background: #5568d3; }
        .btn-secondary {
            background: #48bb78;
            color: white;
        }
        .btn-secondary:hover { background: #38a169; }
        .btn-danger {
            background: #f56565;
            color: white;
        }
        .btn-danger:hover { background: #e53e3e; }
        .status-bar {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .status-running {
            background: #fef3c7;
            color: #92400e;
        }
        .status-pass {
            background: #d1fae5;
            color: #065f46;
        }
        .status-fail {
            background: #fee2e2;
            color: #991b1b;
        }
        .test-section {
            margin-bottom: 30px;
        }
        .test-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e5e7eb;
        }
        .test-item {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid #e5e7eb;
            background: #f9fafb;
        }
        .test-item.pass {
            border-left-color: #10b981;
            background: #ecfdf5;
        }
        .test-item.fail {
            border-left-color: #ef4444;
            background: #fef2f2;
        }
        .test-item.warn {
            border-left-color: #f59e0b;
            background: #fffbeb;
        }
        .test-name {
            font-weight: 600;
            margin-bottom: 5px;
        }
        .test-details {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        .test-error {
            color: #dc2626;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            margin-top: 5px;
            padding: 8px;
            background: #fee2e2;
            border-radius: 4px;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .summary-card {
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .summary-card.total { background: #e0e7ff; color: #3730a3; }
        .summary-card.passed { background: #d1fae5; color: #065f46; }
        .summary-card.failed { background: #fee2e2; color: #991b1b; }
        .summary-card.warnings { background: #fef3c7; color: #92400e; }
        .summary-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .summary-label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .red-flag {
            background: #fee2e2;
            border: 2px solid #ef4444;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .red-flag h3 {
            color: #991b1b;
            margin-bottom: 10px;
        }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e5e7eb;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        code {
            background: #f3f4f6;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 AstroCalc Diagnostics & Validation</h1>
        <p class="subtitle">Comprehensive system-level validation for all features</p>

        <div class="controls">
            <button class="btn-primary" onclick="runAllTests()">Run All Tests</button>
            <button class="btn-secondary" onclick="runQuickCheck()">Quick Check</button>
            <button class="btn-secondary" onclick="verifyAllFormulas()" style="background: #8b5cf6;">Verify All Formulas</button>
            <button class="btn-danger" onclick="clearResults()">Clear Results</button>
        </div>

        <div id="status-bar" class="status-bar" style="display: none;"></div>
        <div class="progress-bar" id="progress-bar" style="display: none;">
            <div class="progress-fill" id="progress-fill" style="width: 0%;">0%</div>
        </div>

        <div class="summary" id="summary" style="display: none;">
            <div class="summary-card total">
                <div class="summary-number" id="total-tests">0</div>
                <div class="summary-label">Total Tests</div>
            </div>
            <div class="summary-card passed">
                <div class="summary-number" id="passed-tests">0</div>
                <div class="summary-label">Passed</div>
            </div>
            <div class="summary-card failed">
                <div class="summary-number" id="failed-tests">0</div>
                <div class="summary-label">Failed</div>
            </div>
            <div class="summary-card warnings">
                <div class="summary-number" id="warning-tests">0</div>
                <div class="summary-label">Warnings</div>
            </div>
        </div>

        <div id="red-flags"></div>
        <div id="test-results"></div>
    </div>

    <!-- Load all scripts in dependency order (OFFLINE-FIRST: All scripts are local, no external dependencies) -->
    <!-- 1. Core data (must be first) -->
    <script src="scripts/formulas.js"></script>
    
    <!-- 2. Core utilities (no dependencies) -->
    <script src="scripts/utils.js"></script>
    <script src="scripts/unitConverter.js"></script>
    <script src="scripts/unitParser.js"></script>
    <script src="scripts/dimensionalAnalysis.js"></script>
    <script src="scripts/expressionParser.js"></script>
    
    <!-- 3. Core calculation engine (depends on formulas) -->
    <script src="scripts/calculator.js"></script>
    
    <!-- 4. Graph systems (standalone) -->
    <script src="scripts/graphManager.js"></script>
    <script src="scripts/offlineGraphManager.js"></script>
    
    <!-- 5. Feature modules (depend on formulas/utils) -->
    <script src="scripts/classification.js"></script>
    <script src="scripts/formulaExplorer.js"></script>
    <script src="scripts/frqSupport.js"></script>
    <script src="scripts/quickNav.js"></script>
    
    <!-- 6. UI controller (depends on everything) -->
    <script src="scripts/ui.js"></script>
    
    <!-- 7. Integration test (for verification) -->
    <script src="scripts/integrationTest.js"></script>
    <script src="scripts/formulaVerification.js"></script>
    
    <!-- 8. Diagnostics (depends on everything, must be last) -->
    <script src="scripts/diagnostics.js"></script>
    
    <!-- Add verification function -->
    <script>
        async function verifyAllFormulas() {
            const statusBar = document.getElementById('status-bar');
            const testResults = document.getElementById('test-results');
            
            statusBar.style.display = 'block';
            statusBar.className = 'status-bar status-running';
            statusBar.textContent = '🔍 Verifying all formulas...';
            
            testResults.innerHTML = '<div class="test-section"><h2>Formula Verification</h2></div>';
            
            try {
                const results = await FormulaVerification.verifyAll();
                
                // Display results
                let html = '<div class="test-section"><h2>Formula Verification Results</h2>';
                
                html += `<div class="summary" style="display: grid;">
                    <div class="summary-card total">
                        <div class="summary-number">${results.total}</div>
                        <div class="summary-label">Total Formulas</div>
                    </div>
                    <div class="summary-card passed">
                        <div class="summary-number">${results.accessible}</div>
                        <div class="summary-label">Accessible</div>
                    </div>
                    <div class="summary-card passed">
                        <div class="summary-number">${results.numerical}</div>
                        <div class="summary-label">Numerical Solving</div>
                    </div>
                    <div class="summary-card passed">
                        <div class="summary-number">${results.symbolic}</div>
                        <div class="summary-label">Symbolic Solving</div>
                    </div>
                </div>`;
                
                if (results.errors.length > 0) {
                    html += '<div class="red-flag"><h3>❌ Errors</h3><ul>';
                    results.errors.forEach(err => {
                        html += `<li>${err}</li>`;
                    });
                    html += '</ul></div>';
                }
                
                if (results.warnings.length > 0) {
                    html += '<div class="test-item warn"><h3>⚠️ Warnings</h3><ul>';
                    results.warnings.slice(0, 20).forEach(warn => {
                        html += `<li>${warn}</li>`;
                    });
                    if (results.warnings.length > 20) {
                        html += `<li>... and ${results.warnings.length - 20} more warnings</li>`;
                    }
                    html += '</ul></div>';
                }
                
                html += '</div>';
                testResults.innerHTML += html;
                
                statusBar.className = 'status-bar status-pass';
                statusBar.textContent = `✅ Verification complete: ${results.numerical}/${results.total} formulas functional (${(results.numerical/results.total*100).toFixed(1)}%)`;
            } catch (e) {
                statusBar.className = 'status-bar status-fail';
                statusBar.textContent = `❌ Verification failed: ${e.message}`;
                testResults.innerHTML += `<div class="test-item fail"><div class="test-error">${e.message}</div></div>`;
            }
        }
    </script>
</body>
</html>
