<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Spectral classes chart (offline reference)">
  <defs>
    <linearGradient id="bg2" x1="0" x2="1">
      <stop offset="0" stop-color="#0b1022"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="band" x1="0" x2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.22" stop-color="#a78bfa"/>
      <stop offset="0.45" stop-color="#f472b6"/>
      <stop offset="0.62" stop-color="#f59e0b"/>
      <stop offset="0.78" stop-color="#fbbf24"/>
      <stop offset="0.9" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="420" rx="18" fill="url(#bg2)"/>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="30" y="44" font-size="22" font-weight="700" fill="#a8c7ff">Spectral Classes (OBAFGKM)</text>
    <text x="30" y="72" font-size="13" fill="#9ca3af">Temperature decreases left → right</text>
  </g>

  <!-- Color band -->
  <g transform="translate(60,120)">
    <rect x="0" y="0" width="780" height="80" rx="14" fill="url(#band)" stroke="rgba(255,255,255,0.18)"/>

    <!-- Dividers -->
    <g stroke="rgba(255,255,255,0.28)" stroke-width="2">
      <path d="M111 0V80M222 0V80M333 0V80M444 0V80M555 0V80M666 0V80"/>
    </g>

    <!-- Labels -->
    <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="800" font-size="22" fill="#0b1022">
      <text x="52"  y="52">O</text>
      <text x="163" y="52">B</text>
      <text x="274" y="52">A</text>
      <text x="385" y="52">F</text>
      <text x="496" y="52">G</text>
      <text x="607" y="52">K</text>
      <text x="718" y="52">M</text>
    </g>
  </g>

  <!-- Temperature ranges -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#e5e7eb">
    <text x="75"  y="245">≥ 33,000 K</text>
    <text x="190" y="245">10,000–33,000 K</text>
    <text x="330" y="245">7,500–10,000 K</text>
    <text x="470" y="245">6,000–7,500 K</text>
    <text x="602" y="245">5,200–6,000 K</text>
    <text x="725" y="245">3,700–5,200 K</text>
    <text x="805" y="245" text-anchor="end">2,400–3,700 K</text>
  </g>

  <!-- Notes -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#9ca3af">
    <text x="30" y="320">Mnemonic: Oh Be A Fine Girl/Guy, Kiss Me</text>
    <text x="30" y="344">Use with luminosity class (I–V) to form full spectral classification (e.g., G2V).</text>
  </g>
</svg>


