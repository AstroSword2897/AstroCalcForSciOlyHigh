<!DOCTYPE html>
<html>
<head>
    <title>Test White Dwarf Problem</title>
</head>
<body>
    <h1>White Dwarf Binary Problem Test</h1>
    <div id="results"></div>
    <script>
        // Wait for calculator to load
        setTimeout(() => {
            if (typeof FormulaCalculator !== 'undefined' && typeof formulas !== 'undefined') {
                testProblem();
            } else {
                document.getElementById('results').innerHTML = '<p>Calculator not loaded yet. Please open the main calculator first.</p>';
            }
        }, 2000);
        
        function testProblem() {
            const M_SUN = 1.989e30;
            const K_red = 10000; // m/s
            const K_blue = 5000; // m/s
            const M_total = 1.5 * M_SUN;
            
            const results = [];
            results.push('<h2>Given Data:</h2>');
            results.push(`<p>K_red = ${K_red} m/s</p>`);
            results.push(`<p>K_blue = ${K_blue} m/s</p>`);
            results.push(`<p>M_total = ${M_total.toExponential(3)} kg = 1.5 M☉</p>`);
            
            // Step 1: Mass ratio
            const mass_ratio = K_blue / K_red;
            const M2 = M_total / (mass_ratio + 1);
            const M1 = mass_ratio * M2;
            
            results.push('<h2>Step 1: Mass Ratio</h2>');
            results.push(`<p>M₁/M₂ = ${mass_ratio}</p>`);
            results.push(`<p>M₁ = ${M1.toExponential(3)} kg = ${(M1/M_SUN).toFixed(3)} M☉</p>`);
            results.push(`<p>M₂ = ${M2.toExponential(3)} kg = ${(M2/M_SUN).toFixed(3)} M☉</p>`);
            
            // Step 2: Find a/P
            const a_over_P = (K_red * M_total) / (2 * Math.PI * M2);
            const G = 6.67430e-11;
            const P = (G * M_total) / (4 * Math.PI * Math.PI * Math.pow(a_over_P, 3));
            const a = a_over_P * P;
            
            results.push('<h2>Step 2: Orbital Parameters</h2>');
            results.push(`<p>a/P = ${a_over_P.toExponential(3)} m/s</p>`);
            results.push(`<p>Period P = ${P.toExponential(3)} s = ${(P/86400).toFixed(2)} days</p>`);
            results.push(`<p>Semi-major axis a = ${a.toExponential(3)} m = ${(a/1.496e11).toFixed(3)} AU</p>`);
            
            // Part A: Test Kepler's Third Law (Binary)
            try {
                const keplerBinary = formulas.find(f => f.id === 'kepler_third_law_binary');
                if (keplerBinary) {
                    const calc = new FormulaCalculator(keplerBinary);
                    const periodResult = calc.solve('P', {
                        'M1': M1,
                        'M2': M2,
                        'a': a,
                        'G': G
                    });
                    results.push('<h2>Part A: Orbital Period (using calculator)</h2>');
                    results.push(`<p>P = ${periodResult.value.toExponential(3)} ${periodResult.unit}</p>`);
                    results.push(`<p>P = ${(periodResult.value/86400).toFixed(2)} days</p>`);
                }
            } catch (e) {
                results.push(`<p style="color:red">Error in Part A: ${e.message}</p>`);
            }
            
            // Part B: Orbital Energy
            try {
                const energyFormula = formulas.find(f => f.id === 'orbital_energy');
                if (energyFormula) {
                    const calc = new FormulaCalculator(energyFormula);
                    const energyResult = calc.solve('E', {
                        'M': M1,
                        'm': M2,
                        'a': a,
                        'G': G
                    });
                    results.push('<h2>Part B: Total Orbital Energy</h2>');
                    results.push(`<p>E = ${energyResult.value.toExponential(3)} ${energyResult.unit}</p>`);
                }
            } catch (e) {
                results.push(`<p style="color:red">Error in Part B: ${e.message}</p>`);
            }
            
            // Part C: Orbital Decay Rate
            try {
                const decayFormula = formulas.find(f => f.id === 'orbital_decay_gravitational_radiation');
                if (decayFormula) {
                    const calc = new FormulaCalculator(decayFormula);
                    const c = 2.99792458e8;
                    const decayResult = calc.solve('da/dt', {
                        'M₁': M1,
                        'M₂': M2,
                        'a': a,
                        'G': G,
                        'c': c
                    });
                    results.push('<h2>Part C: Rate of Orbital Decay</h2>');
                    results.push(`<p>da/dt = ${decayResult.value.toExponential(3)} ${decayResult.unit}</p>`);
                }
            } catch (e) {
                results.push(`<p style="color:red">Error in Part C: ${e.message}</p>`);
            }
            
            // Part D: Merger Time
            try {
                const mergerFormula = formulas.find(f => f.id === 'white_dwarf_merger_timescale');
                if (mergerFormula) {
                    const calc = new FormulaCalculator(mergerFormula);
                    const mergerResult = calc.solve('t_merge', {
                        'M1': M1,
                        'M2': M2,
                        'a': a
                    });
                    results.push('<h2>Part D: Merger Time</h2>');
                    results.push(`<p>t_merge = ${mergerResult.value.toExponential(3)} ${mergerResult.unit}</p>`);
                    results.push(`<p>t_merge = ${(mergerResult.value/(365.25*86400)).toExponential(3)} years</p>`);
                }
            } catch (e) {
                results.push(`<p style="color:red">Error in Part D: ${e.message}</p>`);
            }
            
            document.getElementById('results').innerHTML = results.join('');
        }
    </script>
</body>
</html>
