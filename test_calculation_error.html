<!DOCTYPE html>
<html>
<head>
    <title>Test Calculation Error</title>
</head>
<body>
    <h1>Testing Calculation Error Messages</h1>
    <div id="test-results"></div>
    <script>
        // Test 1: Invalid result object (null/undefined)
        function test1() {
            const result = { result: null, value: null };
            const display = document.getElementById('test-results');
            if (result.result === null && result.value === null) {
                display.innerHTML += '<p style="color: red;">❌ Test 1 FAILED: Result is null, should show error message</p>';
            } else {
                display.innerHTML += '<p style="color: green;">✅ Test 1 PASSED</p>';
            }
        }
        
        // Test 2: Missing result properties
        function test2() {
            const result = {};
            const display = document.getElementById('test-results');
            if (!result.result && !result.value) {
                display.innerHTML += '<p style="color: red;">❌ Test 2 FAILED: Missing result properties, should show error</p>';
            } else {
                display.innerHTML += '<p style="color: green;">✅ Test 2 PASSED</p>';
            }
        }
        
        // Test 3: Error message format
        function test3() {
            const errorMsg = '⚠️ Calculation failed. Please check your inputs.';
            const display = document.getElementById('test-results');
            if (errorMsg.includes('⚠️') && errorMsg.includes('failed')) {
                display.innerHTML += '<p style="color: green;">✅ Test 3 PASSED: Error message format correct</p>';
            } else {
                display.innerHTML += '<p style="color: red;">❌ Test 3 FAILED</p>';
            }
        }
        
        test1();
        test2();
        test3();
    </script>
</body>
</html>
