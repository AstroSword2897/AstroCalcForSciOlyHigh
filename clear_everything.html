<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Clear Everything & Reload</title>
    <style>
        body { font-family: monospace; padding: 40px; background: #1a1a1a; color: #fff; }
        button { background: #667eea; color: white; border: none; padding: 20px 40px; font-size: 18px; cursor: pointer; border-radius: 8px; margin: 10px; }
        button:hover { background: #5568d3; }
        .log { background: #2a2a2a; padding: 20px; margin: 20px 0; border-radius: 8px; max-height: 400px; overflow-y: auto; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .warning { color: #fbbf24; }
    </style>
</head>
<body>
    <h1>🧹 Clear Everything & Force Fresh Load</h1>
    <p>This will:</p>
    <ul>
        <li>Unregister all service workers</li>
        <li>Delete all caches</li>
        <li>Clear localStorage and sessionStorage</li>
        <li>Force reload the application</li>
    </ul>
    
    <button onclick="clearEverything()">🚀 CLEAR & RELOAD</button>
    <button onclick="window.location.href='/'">← Back to App</button>
    
    <div class="log" id="log"></div>
    
    <script>
        function log(msg, type = 'info') {
            const logEl = document.getElementById('log');
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : type === 'warning' ? 'warning' : '';
            logEl.innerHTML += `<div class="${className}">${new Date().toLocaleTimeString()} - ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
            console.log(msg);
        }
        
        async function clearEverything() {
            log('🚀 Starting cleanup...', 'info');
            
            try {
                // 1. Unregister service workers
                if ('serviceWorker' in navigator) {
                    log('📡 Finding service workers...', 'info');
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    log(`Found ${registrations.length} service worker(s)`, 'warning');
                    
                    for (const reg of registrations) {
                        await reg.unregister();
                        log(`✅ Unregistered: ${reg.scope}`, 'success');
                    }
                } else {
                    log('⚠️ Service workers not supported', 'warning');
                }
                
                // 2. Clear all caches
                log('🗑️ Clearing caches...', 'info');
                const cacheNames = await caches.keys();
                log(`Found ${cacheNames.length} cache(s)`, 'warning');
                
                for (const cacheName of cacheNames) {
                    await caches.delete(cacheName);
                    log(`✅ Deleted cache: ${cacheName}`, 'success');
                }
                
                // 3. Clear storage
                log('💾 Clearing localStorage...', 'info');
                localStorage.clear();
                log('✅ localStorage cleared', 'success');
                
                log('💾 Clearing sessionStorage...', 'info');
                sessionStorage.clear();
                log('✅ sessionStorage cleared', 'success');
                
                log('✅ ALL CLEANUP COMPLETE!', 'success');
                log('🔄 Reloading in 2 seconds...', 'warning');
                
                setTimeout(() => {
                    window.location.href = '/?_nocache=' + Date.now();
                }, 2000);
                
            } catch (error) {
                log(`❌ ERROR: ${error.message}`, 'error');
                console.error(error);
            }
        }
        
        // Auto-run on load
        log('Ready. Click button to clear everything.', 'info');
    </script>
</body>
</html>
