<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Manager V2 Test</title>
    <style>
        body {
            font-family: 'Monaco', 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            padding: 20px;
        }
        h1 { color: #00ff00; text-shadow: 0 0 10px #00ff00; }
        .test-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }
        .test-panel {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            border-radius: 8px;
            padding: 20px;
        }
        #graph-container {
            width: 100%;
            height: 400px;
            background: #0f172a;
            border: 1px solid #00ff00;
            border-radius: 8px;
            position: relative;
        }
        button {
            padding: 10px 20px;
            font-size: 14px;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        button:hover { background: #00cc66; }
        .test-output {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            white-space: pre-wrap;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .status.pass { background: rgba(0, 255, 0, 0.2); border: 1px solid #00ff00; }
        .status.fail { background: rgba(255, 0, 0, 0.2); border: 1px solid #ff0000; }
    </style>
</head>
<body>
    <h1>🎨 Graph Manager V2 Test Suite</h1>
    
    <div class="test-container">
        <div class="test-panel">
            <h2>Tests</h2>
            <button onclick="testInit()">Test Initialization</button>
            <button onclick="testRender()">Test Rendering</button>
            <button onclick="testExpressionEval()">Test Expression Evaluation</button>
            <button onclick="testBounds()">Test Bounds Calculation</button>
            <button onclick="testAdaptiveSampling()">Test Adaptive Sampling</button>
            <button onclick="testResize()">Test Resize</button>
            <button onclick="testHover()">Test Hover Tooltip</button>
            <button onclick="runAllTests()">🚀 Run All Tests</button>
            
            <div id="test-results"></div>
        </div>
        
        <div class="test-panel">
            <h2>Graph Display</h2>
            <div id="graph-container"></div>
            <div class="test-output" id="output"></div>
        </div>
    </div>

    <script src="/scripts/enhancedOfflineGraph.js"></script>
    <script>
        const output = document.getElementById('output');
        const resultsDiv = document.getElementById('test-results');
        let graphManager = null;
        let testResults = {
            passed: 0,
            failed: 0,
            tests: []
        };

        function log(msg) {
            const timestamp = new Date().toLocaleTimeString();
            output.textContent += `[${timestamp}] ${msg}\n`;
            output.scrollTop = output.scrollHeight;
            console.log(msg);
        }

        function addResult(testName, passed, message = '') {
            testResults.tests.push({ name: testName, passed, message });
            if (passed) {
                testResults.passed++;
                log(`✅ ${testName}: PASSED${message ? ' - ' + message : ''}`);
            } else {
                testResults.failed++;
                log(`❌ ${testName}: FAILED${message ? ' - ' + message : ''}`);
            }
            updateResultsDisplay();
        }

        function updateResultsDisplay() {
            const total = testResults.passed + testResults.failed;
            const pct = total > 0 ? ((testResults.passed / total) * 100).toFixed(1) : 0;
            
            resultsDiv.innerHTML = `
                <div class="status ${testResults.failed === 0 ? 'pass' : 'fail'}">
                    <strong>Test Results:</strong><br>
                    Passed: ${testResults.passed} | Failed: ${testResults.failed}<br>
                    Pass Rate: ${pct}%
                </div>
            `;
        }

        function testInit() {
            log('\n📐 Testing Initialization...');
            try {
                graphManager = new EnhancedOfflineGraphManagerV2({
                    containerId: 'graph-container',
                    width: 800,
                    height: 400
                });
                
                const initialized = graphManager.init();
                if (initialized) {
                    addResult('Initialization', true, 'Graph manager initialized successfully');
                } else {
                    addResult('Initialization', false, 'init() returned false');
                }
            } catch (e) {
                addResult('Initialization', false, e.message);
            }
        }

        function testRender() {
            log('\n🎨 Testing Rendering...');
            if (!graphManager) {
                testInit();
            }
            
            try {
                const testFormula = {
                    name: 'y = x²',
                    variables: [
                        { symbol: 'x', name: 'x' },
                        { symbol: 'y', name: 'y' }
                    ],
                    solveFunction: ({ x }) => x * x
                };
                
                graphManager.render(testFormula, {});
                
                // Wait a bit for render to complete
                setTimeout(() => {
                    if (graphManager.lastRenderedData && graphManager.lastRenderedData.length > 0) {
                        addResult('Rendering', true, `Generated ${graphManager.lastRenderedData.length} points`);
                    } else {
                        addResult('Rendering', false, 'No data generated');
                    }
                }, 500);
            } catch (e) {
                addResult('Rendering', false, e.message);
            }
        }

        function testExpressionEval() {
            log('\n🔐 Testing Expression Evaluation...');
            if (!graphManager) {
                graphManager = new EnhancedOfflineGraphManagerV2({ containerId: 'graph-container' });
                graphManager.init();
            }
            
            const tests = [
                { expr: '2+3', context: {}, expected: 5, name: 'Simple addition' },
                { expr: 'sin(PI/2)', context: {}, expected: 1, name: 'Math function' },
                { expr: 'x*2', context: { x: 5 }, expected: 10, name: 'Variable substitution' },
                { expr: 'pow(2,3)', context: {}, expected: 8, name: 'Power function' },
                { expr: 'constructor', context: {}, expected: null, name: 'Block unsafe code' },
                { expr: 'process.exit()', context: {}, expected: null, name: 'Block process' },
                { expr: 'eval("1+1")', context: {}, expected: null, name: 'Block eval' }
            ];
            
            let passed = 0;
            for (const test of tests) {
                const result = graphManager.evaluateExpression(test.expr, test.context);
                const match = test.expected === null ? 
                    (result === null) : 
                    (Math.abs(result - test.expected) < 1e-10);
                
                if (match) {
                    passed++;
                    log(`  ✅ ${test.name}: ${result}`);
                } else {
                    log(`  ❌ ${test.name}: expected ${test.expected}, got ${result}`);
                }
            }
            
            addResult('Expression Evaluation', passed === tests.length, `${passed}/${tests.length} tests passed`);
        }

        function testBounds() {
            log('\n📏 Testing Bounds Calculation...');
            if (!graphManager) {
                graphManager = new EnhancedOfflineGraphManagerV2({ containerId: 'graph-container' });
                graphManager.init();
            }
            
            try {
                const testFormula = {
                    name: 'Test',
                    variables: [
                        { symbol: 'r', name: 'radius' }
                    ]
                };
                
                graphManager.calculateEnhancedBounds(testFormula, testFormula.variables[0], {});
                
                const bounds = graphManager.bounds;
                const valid = isFinite(bounds.left) && isFinite(bounds.right) && 
                             isFinite(bounds.top) && isFinite(bounds.bottom) &&
                             bounds.left < bounds.right && bounds.bottom < bounds.top;
                
                if (valid) {
                    addResult('Bounds Calculation', true, 
                        `Bounds: [${bounds.left.toFixed(2)}, ${bounds.right.toFixed(2)}] x [${bounds.bottom.toFixed(2)}, ${bounds.top.toFixed(2)}]`);
                } else {
                    addResult('Bounds Calculation', false, 'Invalid bounds');
                }
            } catch (e) {
                addResult('Bounds Calculation', false, e.message);
            }
        }

        function testAdaptiveSampling() {
            log('\n📊 Testing Adaptive Sampling...');
            if (!graphManager) {
                graphManager = new EnhancedOfflineGraphManagerV2({ containerId: 'graph-container' });
                graphManager.init();
            }
            
            try {
                const testFormula = {
                    name: 'y = sin(x)',
                    variables: [{ symbol: 'x', name: 'x' }],
                    solveFunction: ({ x }) => Math.sin(x)
                };
                
                graphManager.bounds = { left: -Math.PI, right: Math.PI, bottom: -2, top: 2 };
                const data = graphManager._adaptiveSubdivide(testFormula, testFormula.variables[0], {}, 200);
                
                if (data && data.length >= graphManager.minPoints && data.length <= graphManager.maxPoints) {
                    addResult('Adaptive Sampling', true, `Generated ${data.length} points`);
                } else {
                    addResult('Adaptive Sampling', false, `Invalid point count: ${data ? data.length : 0}`);
                }
            } catch (e) {
                addResult('Adaptive Sampling', false, e.message);
            }
        }

        function testResize() {
            log('\n📐 Testing Resize Handling...');
            if (!graphManager) {
                graphManager = new EnhancedOfflineGraphManagerV2({ containerId: 'graph-container' });
                graphManager.init();
            }
            
            try {
                const oldWidth = graphManager.width;
                const oldHeight = graphManager.height;
                
                // Simulate resize
                const container = document.getElementById('graph-container');
                container.style.width = '600px';
                container.style.height = '300px';
                
                graphManager._updateSize();
                
                const newWidth = graphManager.width;
                const newHeight = graphManager.height;
                
                if (newWidth !== oldWidth || newHeight !== oldHeight) {
                    addResult('Resize Handling', true, `Size updated: ${oldWidth}x${oldHeight} → ${newWidth}x${newHeight}`);
                } else {
                    addResult('Resize Handling', false, 'Size not updated');
                }
            } catch (e) {
                addResult('Resize Handling', false, e.message);
            }
        }

        function testHover() {
            log('\n🖱️ Testing Hover Tooltip...');
            if (!graphManager) {
                graphManager = new EnhancedOfflineGraphManagerV2({ containerId: 'graph-container' });
                graphManager.init();
            }
            
            try {
                // Check if tooltip element exists
                const tooltip = graphManager.tooltip;
                if (tooltip && tooltip instanceof HTMLElement) {
                    addResult('Hover Tooltip', true, 'Tooltip element created');
                } else {
                    addResult('Hover Tooltip', false, 'Tooltip element not found');
                }
            } catch (e) {
                addResult('Hover Tooltip', false, e.message);
            }
        }

        async function runAllTests() {
            log('\n🚀 Running All Tests...\n');
            testResults = { passed: 0, failed: 0, tests: [] };
            output.textContent = '';
            
            testInit();
            await new Promise(r => setTimeout(r, 200));
            
            testExpressionEval();
            await new Promise(r => setTimeout(r, 200));
            
            testBounds();
            await new Promise(r => setTimeout(r, 200));
            
            testAdaptiveSampling();
            await new Promise(r => setTimeout(r, 200));
            
            testResize();
            await new Promise(r => setTimeout(r, 200));
            
            testHover();
            await new Promise(r => setTimeout(r, 200));
            
            testRender();
            await new Promise(r => setTimeout(r, 500));
            
            log('\n✅ All tests completed!');
            log(`\nSummary: ${testResults.passed} passed, ${testResults.failed} failed`);
        }

        // Auto-run on load
        window.addEventListener('load', () => {
            log('Graph Manager V2 Test Suite Ready');
            log('Click "Run All Tests" to begin');
        });
    </script>
</body>
</html>
