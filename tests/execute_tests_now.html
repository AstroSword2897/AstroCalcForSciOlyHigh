<!DOCTYPE html>
<html>
<head>
    <title>Execute Tests Now</title>
    <script>
        // Redirect to test page and auto-execute
        window.onload = function() {
            // Navigate to test page
            window.location.href = 'http://localhost:8000/tests/run_production_tests.html';
            
            // Wait for page load, then execute
            setTimeout(() => {
                // Execute tests via console
                const script = document.createElement('script');
                script.textContent = `
                    (function() {
                        console.log('🚀 Auto-executing calculator tests...');
                        
                        // Wait for test functions to be available
                        function waitForTests() {
                            if (typeof CalculatorTestSuite !== 'undefined' && typeof CalculatorTestSuite.runAllCalculatorTests === 'function') {
                                console.log('✅ CalculatorTestSuite found, starting tests...');
                                CalculatorTestSuite.runAllCalculatorTests().then(results => {
                                    console.log('✅ Tests completed!', results);
                                }).catch(err => {
                                    console.error('❌ Test error:', err);
                                });
                            } else if (typeof runCalculatorOnly === 'function') {
                                console.log('✅ runCalculatorOnly found, starting tests...');
                                runCalculatorOnly();
                            } else {
                                console.log('⏳ Waiting for test functions...');
                                setTimeout(waitForTests, 500);
                            }
                        }
                        
                        // Start after page fully loads
                        if (document.readyState === 'complete') {
                            setTimeout(waitForTests, 1000);
                        } else {
                            window.addEventListener('load', () => {
                                setTimeout(waitForTests, 1000);
                            });
                        }
                    })();
                `;
                document.head.appendChild(script);
            }, 2000);
        };
    </script>
</head>
<body>
    <h1>🚀 Executing Tests...</h1>
    <p>Redirecting and starting test execution...</p>
</body>
</html>
