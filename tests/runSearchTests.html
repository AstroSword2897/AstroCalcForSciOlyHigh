<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Test Harness - 5,000+ Tests</title>
    <style>
        body {
            font-family: 'Monaco', 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            padding: 20px;
            line-height: 1.6;
        }
        h1 { color: #00ff00; text-shadow: 0 0 10px #00ff00; }
        .controls {
            margin: 20px 0;
            padding: 20px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            border-radius: 8px;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        button:hover { background: #00cc66; }
        button:disabled { background: #666; cursor: not-allowed; }
        .test-output {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            white-space: pre-wrap;
            font-size: 12px;
            max-height: 600px;
            overflow-y: auto;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid #667eea;
            border-radius: 8px;
            padding: 15px;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #00ff88;
        }
        .stat-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>🚀 Search Test Harness - 5,000+ Tests</h1>
    <p>Automated testing with weighted concepts and 10,000+ context connections</p>
    
    <div class="controls">
        <button onclick="loadAndRunTests()">Run All Tests (5,000+)</button>
        <button onclick="runSampleTests()">Run Sample (100 tests)</button>
        <button onclick="exportResults()">Export Results (JSON)</button>
        <button onclick="clearOutput()">Clear Output</button>
    </div>
    
    <div class="stats" id="stats" style="display: none;">
        <div class="stat-card">
            <div class="stat-value" id="stat-total">0</div>
            <div class="stat-label">Total Tests</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-passed">0</div>
            <div class="stat-label">Passed</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-failed">0</div>
            <div class="stat-label">Failed</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-passrate">0%</div>
            <div class="stat-label">Pass Rate</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-avgtime">0ms</div>
            <div class="stat-label">Avg Time</div>
        </div>
    </div>
    
    <div id="output" class="test-output">Ready to run tests...\n\nClick "Run All Tests" to start comprehensive testing.</div>
    
    <!-- Load dependencies -->
    <script src="/scripts/formulas.js"></script>
    <script src="/scripts/utils.js"></script>
    <script src="/scripts/frqSupport.js"></script>
    <script src="/scripts/ui.js"></script>
    
    <!-- Load test harness -->
    <script src="/tests/searchTestHarness.js"></script>
    
    <script>
        const output = document.getElementById('output');
        let testCases = [];
        let results = null;
        
        // Capture console output
        const logs = [];
        const originalLog = console.log;
        const originalWarn = console.warn;
        const originalError = console.error;
        
        console.log = function(...args) {
            const text = args.join(' ');
            logs.push(text);
            originalLog.apply(console, args);
            updateOutput();
        };
        
        console.warn = function(...args) {
            const text = '⚠️  ' + args.join(' ');
            logs.push(text);
            originalWarn.apply(console, args);
            updateOutput();
        };
        
        console.error = function(...args) {
            const text = '❌ ' + args.join(' ');
            logs.push(text);
            originalError.apply(console, args);
            updateOutput();
        };
        
        function updateOutput() {
            output.textContent = logs.join('\n');
            output.scrollTop = output.scrollHeight;
        }
        
        async function loadTestCases() {
            try {
                const response = await fetch('/tests/search_test_cases.json');
                testCases = await response.json();
                console.log(`✅ Loaded ${testCases.length} test cases`);
                return true;
            } catch (e) {
                console.error(`❌ Failed to load test cases: ${e.message}`);
                return false;
            }
        }
        
        async function loadAndRunTests() {
            output.textContent = 'Loading test cases...\n';
            logs.length = 0;
            
            if (!await loadTestCases()) {
                output.textContent += '\n❌ Could not load test cases. Make sure to run: python3 tests/generate_test_cases.py';
                return;
            }
            
            if (typeof SearchTestHarness === 'undefined') {
                output.textContent += '\n❌ SearchTestHarness not loaded!';
                return;
            }
            
            if (typeof filterAndRenderFormulas === 'undefined') {
                output.textContent += '\n❌ filterAndRenderFormulas not available!';
                return;
            }
            
            document.getElementById('stats').style.display = 'grid';
            
            console.log('Starting test execution...\n');
            results = await SearchTestHarness.runAllTests(testCases);
            
            updateStats(results);
        }
        
        async function runSampleTests() {
            output.textContent = 'Loading test cases...\n';
            logs.length = 0;
            
            if (!await loadTestCases()) {
                output.textContent += '\n❌ Could not load test cases.';
                return;
            }
            
            const sample = testCases.slice(0, 100);
            console.log(`Running sample of ${sample.length} tests...\n`);
            
            document.getElementById('stats').style.display = 'grid';
            
            results = await SearchTestHarness.runAllTests(sample);
            updateStats(results);
        }
        
        function updateStats(results) {
            document.getElementById('stat-total').textContent = results.total;
            document.getElementById('stat-passed').textContent = results.passed;
            document.getElementById('stat-failed').textContent = results.failed;
            document.getElementById('stat-passrate').textContent = 
                ((results.passed / results.total) * 100).toFixed(1) + '%';
            document.getElementById('stat-avgtime').textContent = 
                results.performanceMetrics.averageTime.toFixed(2) + 'ms';
        }
        
        function exportResults() {
            if (!results) {
                alert('No results to export. Run tests first.');
                return;
            }
            
            const json = SearchTestHarness.exportResults();
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `search-test-results-${new Date().toISOString().replace(/[:.]/g, '-')}.json`;
            a.click();
            console.log('✅ Results exported!');
        }
        
        function clearOutput() {
            logs.length = 0;
            output.textContent = 'Output cleared.';
        }
    </script>
</body>
</html>
