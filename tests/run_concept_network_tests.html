<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept Network Tests</title>
    <style>
        body {
            font-family: 'Monaco', 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            padding: 20px;
            line-height: 1.6;
        }
        h1 { color: #00ff00; text-shadow: 0 0 10px #00ff00; }
        .controls {
            margin: 20px 0;
            padding: 20px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            border-radius: 8px;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        button:hover { background: #00cc66; }
        button:disabled { background: #666; cursor: not-allowed; }
        .test-output {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            white-space: pre-wrap;
            font-size: 12px;
            max-height: 600px;
            overflow-y: auto;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            border-radius: 8px;
            padding: 15px;
        }
        .stat-card h3 {
            margin: 0 0 10px 0;
            color: #00ff00;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #00ff00;
        }
    </style>
</head>
<body>
    <h1>🧪 Concept Network Test Suite</h1>
    
    <div class="controls">
        <button onclick="runAllTests()">🚀 Run All Tests</button>
        <button onclick="runDimensionalIntegrity()">📐 Dimensional Integrity</button>
        <button onclick="runWeightedInfluence()">⚖️ Weighted Influence</button>
        <button onclick="runStressTests()">💪 Stress Tests</button>
        <button onclick="runSemanticDistance()">📏 Semantic Distance</button>
        <button onclick="exportResults()">💾 Export Results</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="test-output" id="output"></div>

    <script src="/tests/conceptNetwork_tests.js"></script>
    <script>
        const output = document.getElementById('output');
        const stats = document.getElementById('stats');
        let testSuite = null;
        let testResults = null;

        // Override console.log to capture output
        const originalLog = console.log;
        const originalError = console.error;
        const logs = [];

        console.log = function(...args) {
            originalLog.apply(console, args);
            const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ');
            logs.push(msg);
            output.textContent = logs.join('\n');
            output.scrollTop = output.scrollHeight;
        };

        console.error = function(...args) {
            originalError.apply(console, args);
            const msg = '❌ ' + args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ');
            logs.push(msg);
            output.textContent = logs.join('\n');
            output.scrollTop = output.scrollHeight;
        };

        function updateStats(results) {
            if (!results) return;
            
            stats.innerHTML = '';
            
            Object.entries(results).forEach(([suite, result]) => {
                const card = document.createElement('div');
                card.className = 'stat-card';
                const total = result.passed + result.failed;
                const pct = total > 0 ? ((result.passed / total) * 100).toFixed(1) : 0;
                const status = result.failed === 0 ? '✅' : '❌';
                
                card.innerHTML = `
                    <h3>${status} ${suite.replace(/([A-Z])/g, ' $1').trim()}</h3>
                    <div class="stat-value">${result.passed}/${total}</div>
                    <div>${pct}% pass rate</div>
                    ${result.failed > 0 ? `<div style="color: #ff4444;">${result.failed} failed</div>` : ''}
                `;
                stats.appendChild(card);
            });
        }

        async function runAllTests() {
            logs.length = 0;
            output.textContent = '';
            console.log('🚀 Starting Concept Network Test Suite...\n');
            
            testSuite = new ConceptNetworkTestSuite();
            testResults = await testSuite.runAllTests();
            updateStats(testResults);
        }

        async function runDimensionalIntegrity() {
            logs.length = 0;
            output.textContent = '';
            console.log('📐 Running Dimensional Integrity Tests...\n');
            
            if (!testSuite) {
                testSuite = new ConceptNetworkTestSuite();
                await testSuite.loadConceptMap();
            }
            
            testSuite.testDimensionalIntegrity();
            updateStats(testSuite.results);
        }

        async function runWeightedInfluence() {
            logs.length = 0;
            output.textContent = '';
            console.log('⚖️ Running Weighted Influence Tests...\n');
            
            if (!testSuite) {
                testSuite = new ConceptNetworkTestSuite();
                await testSuite.loadConceptMap();
            }
            
            testSuite.testWeightedInfluence();
            updateStats(testSuite.results);
        }

        async function runStressTests() {
            logs.length = 0;
            output.textContent = '';
            console.log('💪 Running Stress Tests...\n');
            
            if (!testSuite) {
                testSuite = new ConceptNetworkTestSuite();
                await testSuite.loadConceptMap();
            }
            
            testSuite.testStressTests();
            updateStats(testSuite.results);
        }

        async function runSemanticDistance() {
            logs.length = 0;
            output.textContent = '';
            console.log('📏 Running Semantic Distance Tests...\n');
            
            if (!testSuite) {
                testSuite = new ConceptNetworkTestSuite();
                await testSuite.loadConceptMap();
            }
            
            testSuite.testSemanticDistance();
            updateStats(testSuite.results);
        }

        function exportResults() {
            if (!testResults) {
                console.log('❌ No test results to export');
                return;
            }
            
            const json = JSON.stringify(testResults, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `concept-network-tests-${new Date().toISOString().replace(/[:.]/g, '-')}.json`;
            a.click();
            console.log('✅ Results exported!');
        }
    </script>
</body>
</html>
