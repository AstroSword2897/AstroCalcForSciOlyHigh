<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test: ANY Astrophysics Question</title>
    <style>
        body {
            font-family: 'Monaco', 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            text-align: center;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }
        .test-output {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #fff;
            border-radius: 12px;
            padding: 30px;
            margin: 20px auto;
            max-width: 1200px;
            white-space: pre-wrap;
            font-size: 13px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .pass { color: #00ff88; font-weight: bold; }
        .fail { color: #ff4444; font-weight: bold; }
        .warn { color: #ffaa00; }
        .section { 
            color: #00d4ff; 
            font-weight: bold; 
            font-size: 16px;
            text-shadow: 0 0 10px #00d4ff;
        }
        .category { color: #ff79c6; }
        .interactive {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        input {
            width: 70%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #fff;
            background: rgba(255,255,255,0.9);
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
        }
        button:hover {
            background: #00cc66;
            transform: scale(1.05);
        }
        #custom-result {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,255,136,0.1);
            border: 1px solid #00ff88;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>🔬 Test ANY Astrophysics Question</h1>
    <p style="text-align: center; font-size: 18px;">Comprehensive search accuracy validation across all 191 formulas</p>
    
    <div class="interactive">
        <h2>🧪 Try Your Own Question:</h2>
        <input type="text" id="custom-question" placeholder="Type any astrophysics question..." />
        <button onclick="testCustomQuestion()">Search</button>
        <div id="custom-result"></div>
    </div>
    
    <div id="output" class="test-output">Running comprehensive tests...</div>
    
    <!-- Load all dependencies -->
    <script src="/scripts/formulas.js"></script>
    <script src="/scripts/utils.js"></script>
    <script src="/scripts/calculator.js"></script>
    <script src="/scripts/unitConverter.js"></script>
    <script src="/scripts/frqSupport.js"></script>
    <script src="/scripts/ui.js"></script>
    
    <script>
        const output = document.getElementById('output');
        
        // Wait for everything to load
        setTimeout(() => {
            output.textContent = 'Loading test suite...\n\n';
            
            fetch('/tests/astrophysics-question-accuracy.js')
                .then(r => r.text())
                .then(code => {
                    // Capture console output
                    const logs = [];
                    const originalLog = console.log;
                    
                    console.log = function(...args) {
                        const text = args.join(' ');
                        logs.push(text);
                        originalLog.apply(console, args);
                    };
                    
                    try {
                        eval(code);
                        
                        // Display colored output
                        setTimeout(() => {
                            let html = logs.join('\n');
                            
                            // Colorize
                            html = html.replace(/✅/g, '<span class="pass">✅</span>');
                            html = html.replace(/❌/g, '<span class="fail">❌</span>');
                            html = html.replace(/⚠️/g, '<span class="warn">⚠️</span>');
                            html = html.replace(/🟢/g, '<span class="pass">🟢</span>');
                            html = html.replace(/🟡/g, '<span class="warn">🟡</span>');
                            html = html.replace(/🔴/g, '<span class="fail">🔴</span>');
                            html = html.replace(/(Category: [^\|]+)/g, '<span class="category">$1</span>');
                            html = html.replace(/(RESULTS BY CATEGORY|FINAL RESULTS|COMPREHENSIVE ASTROPHYSICS)/g, 
                                               '<span class="section">$1</span>');
                            
                            output.innerHTML = html;
                        }, 200);
                    } catch (e) {
                        output.textContent = 'Error running tests:\n' + e.message + '\n\n' + e.stack;
                    }
                })
                .catch(err => {
                    output.textContent = 'Error loading tests:\n' + err.message;
                });
        }, 2000);
        
        // Interactive testing function
        function testCustomQuestion() {
            const question = document.getElementById('custom-question').value;
            const resultDiv = document.getElementById('custom-result');
            
            if (!question) {
                resultDiv.innerHTML = '<span class="fail">⚠️  Please enter a question</span>';
                return;
            }
            
            resultDiv.innerHTML = '<span class="warn">Searching...</span>';
            
            setTimeout(() => {
                try {
                    const results = filterAndRenderFormulas(question, 5, true);
                    
                    if (results.length === 0) {
                        resultDiv.innerHTML = `
                            <span class="fail">❌ No results found</span><br>
                            Try a different question or check spelling
                        `;
                        return;
                    }
                    
                    let html = `<h3 style="color: #00ff88;">Top ${Math.min(5, results.length)} Results:</h3>`;
                    
                    results.slice(0, 5).forEach((result, i) => {
                        const confidence = Math.round(result.confidence || 0);
                        const emoji = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '▪️';
                        const confColor = confidence >= 80 ? '#00ff88' : confidence >= 50 ? '#ffaa00' : '#ff4444';
                        
                        html += `
                            <div style="margin: 10px 0; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 5px;">
                                ${emoji} <strong>${result.name}</strong>
                                <span style="color: ${confColor}; float: right;">${confidence}%</span><br>
                                <span style="color: #aaa; font-size: 12px;">${result.id}</span><br>
                                <span style="color: #ccc;">${result.equation}</span>
                            </div>
                        `;
                    });
                    
                    resultDiv.innerHTML = html;
                } catch (e) {
                    resultDiv.innerHTML = `<span class="fail">❌ Error: ${e.message}</span>`;
                }
            }, 100);
        }
        
        // Allow Enter key to search
        document.getElementById('custom-question').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                testCustomQuestion();
            }
        });
    </script>
</body>
</html>
