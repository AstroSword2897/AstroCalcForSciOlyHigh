<!DOCTYPE html>
<html>
<head>
<script>
setTimeout(() => {
    console.log('=== Calculator Screen Test ===');
    const inputScreen = document.getElementById('input-screen');
    const tabs = document.querySelector('.tabs');
    const tabButtons = document.querySelectorAll('.tab-btn');
    
    console.log('Input screen:', inputScreen ? 'found' : 'NOT FOUND');
    if (inputScreen) {
        console.log('  - display:', window.getComputedStyle(inputScreen).display);
        console.log('  - visibility:', window.getComputedStyle(inputScreen).visibility);
        console.log('  - has active class:', inputScreen.classList.contains('active'));
    }
    
    console.log('Tabs container:', tabs ? 'found' : 'NOT FOUND');
    if (tabs) {
        console.log('  - display:', window.getComputedStyle(tabs).display);
    }
    
    console.log('Tab buttons:', tabButtons.length);
    tabButtons.forEach((btn, i) => {
        console.log(`  ${i}: ${btn.getAttribute('data-tab')} - display: ${window.getComputedStyle(btn).display}`);
    });
}, 2000);
</script>
</head>
<body></body>
</html>
