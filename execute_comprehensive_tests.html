<!DOCTYPE html>
<html>
<head>
    <title>Comprehensive Feature Testing</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #0f0; }
        .pass { color: #0f0; }
        .fail { color: #f00; }
        .info { color: #ff0; }
        pre { background: #000; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🚀 Comprehensive Feature Testing Suite</h1>
    <button onclick="runAllTests()" style="padding: 10px 20px; font-size: 16px; margin: 10px 0;">Run All Tests</button>
    <div id="results"></div>
    
    <script>
        // Wait for main app to load
        window.addEventListener('load', () => {
            setTimeout(() => {
                console.log('Test suite ready. Click "Run All Tests" button.');
            }, 3000);
        });
        
        async function runAllTests() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<h2>Running Tests...</h2>';
            
            const tester = new ComprehensiveTester();
            const results = await tester.runAll();
            
            // Display results
            let html = '<h2>Test Results</h2>';
            html += '<pre>' + JSON.stringify(results, null, 2) + '</pre>';
            resultsDiv.innerHTML = html;
        }
    </script>
    
    <!-- Load the test script -->
    <script src="run_comprehensive_tests.js"></script>
</body>
</html>
