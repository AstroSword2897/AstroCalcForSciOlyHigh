<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Execute Tests - 100% x10</title>
    <style>
        body {
            font-family: monospace;
            background: #0a0a0a;
            color: #00ff00;
            padding: 20px;
        }
        .status {
            padding: 20px;
            margin: 20px 0;
            border: 2px solid #00ff00;
            border-radius: 8px;
        }
        .running { border-color: #ffff00; }
        .complete { border-color: #00ff00; }
        .error { border-color: #ff0000; }
    </style>
</head>
<body>
    <h1>🧪 Execute Tests Until 100% x10</h1>
    <div id="status" class="status">Ready to execute...</div>
    <div id="output" style="white-space: pre-wrap; font-size: 12px;"></div>

    <script>
        const output = document.getElementById('output');
        const status = document.getElementById('status');
        
        function log(msg) {
            output.textContent += msg + '\n';
            output.scrollTop = output.scrollHeight;
            console.log(msg);
        }
        
        async function executeTests() {
            status.className = 'status running';
            status.textContent = 'Running tests...';
            log('🚀 Starting test execution - Target: 100% x10');
            log('='.repeat(80));
            
            try {
                // Wait for page to fully load
                await new Promise(r => setTimeout(r, 2000));
                
                // Open test page in iframe
                const iframe = document.createElement('iframe');
                iframe.src = '/tests/run_production_tests.html';
                iframe.style.display = 'none';
                document.body.appendChild(iframe);
                
                await new Promise(r => setTimeout(r, 3000));
                
                // Try to execute via iframe
                try {
                    const iframeWindow = iframe.contentWindow;
                    if (iframeWindow && typeof iframeWindow.runCalculatorOnly === 'function') {
                        log('✅ Found test function, executing...');
                        iframeWindow.runCalculatorOnly();
                        log('✅ Tests started in iframe');
                    } else {
                        log('⚠️  Test function not found in iframe');
                        log('📋 Please open http://localhost:8000/tests/run_production_tests.html');
                        log('   and click "🧮 Calculator Tests Only" button');
                    }
                } catch (e) {
                    log('⚠️  Cannot access iframe (cross-origin): ' + e.message);
                    log('📋 Opening test page in new window...');
                    window.open('/tests/run_production_tests.html', '_blank');
                }
                
                status.className = 'status complete';
                status.textContent = '✅ Test execution initiated';
                log('\n✅ Test execution initiated');
                log('📊 Monitor progress in the test page');
                
            } catch (e) {
                status.className = 'status error';
                status.textContent = '❌ Error: ' + e.message;
                log('❌ Error: ' + e.message);
            }
        }
        
        // Auto-execute on load
        window.addEventListener('load', () => {
            setTimeout(executeTests, 1000);
        });
    </script>
</body>
</html>
