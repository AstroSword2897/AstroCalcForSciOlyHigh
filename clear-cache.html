<!DOCTYPE html>
<html>
<head>
    <title>Clear Cache</title>
</head>
<body>
    <h1>Clearing Service Worker Cache...</h1>
    <script>
        (function() {
            let cleared = false;
            
            if ('serviceWorker' in navigator) {
                Promise.all([
                    navigator.serviceWorker.getRegistrations().then(registrations => {
                        return Promise.all(registrations.map(registration => {
                            console.log('Unregistering:', registration.scope);
                            return registration.unregister();
                        }));
                    }),
                    caches.keys().then(cacheNames => {
                        return Promise.all(
                            cacheNames.map(cacheName => {
                                console.log('Deleting cache:', cacheName);
                                return caches.delete(cacheName);
                            })
                        );
                    })
                ]).then(() => {
                    if (!cleared) {
                        cleared = true;
                        document.body.innerHTML = '<h1>✅ Cache Cleared!</h1><p><a href="./index.html">Click here to continue</a></p>';
                    }
                }).catch(err => {
                    console.error('Error clearing cache:', err);
                    document.body.innerHTML = '<h1>Cache cleared (with errors). <a href="./index.html">Continue</a></h1>';
                });
            } else {
                document.body.innerHTML = '<h1>Service Worker not supported. <a href="./index.html">Continue</a></h1>';
            }
        })();
    </script>
</body>
</html>
